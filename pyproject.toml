[build-system]
requires = ["setuptools>=83.0.0", "setuptools-scm>=10.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ZemaxGlass"
description = "Zemax glass (.agf) file reader"
readme = "README.md"
version = "2.0.1a1"

license = "MIT"
license-files = ["LICENSE.txt",]

authors = [
    {name = "Nathan Hagen", email = "and.the.light.shattered@gmail.com"},
]

classifiers = [ 
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
keywords = [ "zemax", "glass", "spectra", "dispersion",]

requires-python = ">=3.12"

dependencies = [ 
    "numpy>=2.5.1", 
    "scipy>=1.18.0", 
    "matplotlib>=3.11.1", 
    "cycler>=0.12.1",
]

[project.urls]
Homepage = "https://github.com/nzhagen/zemaxglass"
Documentation = "https://github.com/nzhagen/zemaxglass/ZemaxGlass_user_manual.pdf"
"Bug Tracker" = "https://github.com/nzhagen/zemaxglass/issues"
"Source Code" = "https://github.com/nzhagen/zemaxglass"

[project.optional-dependencies]
testing = [ "setuptools", "pytest", "pytest-cov",]

[project.gui-scripts]
zemaxglassdemo = "ZemaxGlass.ZemaxGlass:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
ZemaxGlass.AGF_files = ["*.agf", "*.AGF"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
addopts = "--verbose"
norecursedirs = [ "dist", "build",]
testpaths = [ "tests",]
